name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Only Chromium. The e2e suite is all that runs here, and
      # playwright.config.ts only defines Chromium projects; installing all three
      # browsers roughly triples the step.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Lint before build: it is the fastest signal and does not need a server.
      - run: npm run lint

      - run: npm run build

      # Kept out of the app's tsconfig so a test can never break next build,
      # which means nothing else type-checks it.
      - run: npm run typecheck:e2e

      # Starts its own next start on 3100 against the build above.
      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the trace when e2e fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
