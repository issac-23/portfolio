name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-contrast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Only Chromium. contrast.mjs and the e2e suite are all that run here, and
      # playwright.config.ts only defines Chromium projects; installing all three
      # browsers roughly triples the step.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Lint before build: it is the fastest signal and does not need a server.
      - run: npm run lint

      - run: npm run build

      # contrast.mjs measures computed styles in a real browser, so it needs the
      # app actually served. Production build rather than next dev: that is what
      # ships, and dev's on-demand compilation makes the first request slow
      # enough to trip the script's own 30s navigation timeout.
      - name: Start the app
        run: |
          npm start &
          # Plain poll rather than npx wait-on, which would pull an undeclared
          # package over the network on every run.
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not come up within 60s"; exit 1

      - name: Check contrast
        run: npm run check:contrast

      # Kept out of the app's tsconfig so a test can never break next build,
      # which means nothing else type-checks it.
      - run: npm run typecheck:e2e

      # Starts its own next start on 3100 against the build above, so it does
      # not share the server contrast.mjs used.
      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the trace when e2e fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
